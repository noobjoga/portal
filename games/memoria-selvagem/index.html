<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102a43"><title>Memória Selvagem — AGORA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d5064,#102a43 70%);color:#f4fbff;font:15px system-ui,sans-serif;min-height:100vh;padding:clamp(12px,3vw,26px)}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:2px;color:#7ce8d7}.back,button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.back{background:#ffffff18;color:white;text-decoration:none;font-size:13px}.intro{text-align:center;margin:22px auto 18px}.intro h1{font-size:clamp(26px,5vw,42px);margin:4px}.intro p{color:#c0dbe4;margin:5px}.stats{display:flex;justify-content:center;gap:10px;margin:14px}.stat{background:#ffffff14;border:1px solid #ffffff20;padding:8px 15px;border-radius:12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.6vw,14px);max-width:640px;margin:0 auto}.card{aspect-ratio:1;border:1px solid #ffffff2b;border-radius:16px;background:linear-gradient(145deg,#247c8b,#17536c);color:white;display:grid;place-items:center;font-size:clamp(25px,6vw,48px);box-shadow:0 6px 0 #0b3548;transition:transform .15s;position:relative;overflow:hidden}.card:active{transform:scale(.96)}.card.open,.card.matched{background:#f5fbff;color:#15384b;box-shadow:0 5px 0 #b5d3dc}.card.matched{background:#baf4df}.card .face{display:none;text-align:center}.card.open .backmark,.card.matched .backmark{display:none}.card.open .face,.card.matched .face{display:grid;gap:2px}.card small{font-size:clamp(8px,1.8vw,12px);font-weight:800}.status{text-align:center;min-height:48px;margin:18px auto;color:#e4f7fa;font-weight:700}.restart{display:block;margin:8px auto;background:#7ce8d7;color:#103449}.fact{max-width:640px;margin:10px auto 0;padding:13px 16px;border-radius:14px;background:#ffffff12;text-align:center;color:#d9f2f5;min-height:48px;font-size:13px}.foot{text-align:center;color:#9dbbc6;font-size:11px;margin:20px}
@media(max-width:420px){.grid{gap:6px}.card{border-radius:11px}.stats{gap:6px}.stat{padding:7px 9px;font-size:11px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">✦ AGORA</div><a class="back" href="/#jogos">← Voltar ao AGORA</a></div><header class="intro"><div>🐾 🌿 🦜</div><h1>Memória Selvagem</h1><p>Encontre os pares e descubra curiosidades da natureza.</p></header><div class="stats"><div class="stat">Pares: <b id="pairs">0/8</b></div><div class="stat">Tentativas: <b id="tries">0</b></div><div class="stat">Tempo: <b id="time">0:00</b></div></div><section class="grid" id="grid" aria-label="Jogo da memória"></section><p class="status" id="status" aria-live="polite">Toque em duas cartas para encontrar os pares!</p><div class="fact" id="fact">Cada par revela uma curiosidade animal.</div><button class="restart" id="restart">↻ Embaralhar e jogar novamente</button><div class="foot">Jogo original AGORA · Aprender brincando</div></main>
<script>
const animals=[["🐢","Tartaruga","Algumas tartarugas marinhas conseguem viajar milhares de quilômetros entre áreas de alimentação e reprodução."],["🦉","Coruja","Muitas corujas conseguem girar a cabeça bastante porque têm adaptações especiais no pescoço e no fluxo sanguíneo."],["🐝","Abelha","Ao visitar flores, abelhas transportam pólen e ajudam muitas plantas a se reproduzir."],["🐙","Polvo","Polvos têm três corações e grande parte de seus neurônios está distribuída pelos braços."],["🦇","Morcego","Muitos morcegos usam ecolocalização: emitem sons e interpretam o eco para se orientar."],["🐬","Golfinho","Golfinhos usam sons e assobios para se comunicar e localizar objetos."],["🦋","Borboleta","Borboletas sentem sabores com receptores localizados principalmente nas patas."],["🐧","Pinguim","As penas densas e uma camada de gordura ajudam pinguins a conservar calor na água fria."]];
let deck=[],first=null,lock=false,matches=0,tries=0,seconds=0,timer=null;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function tick(){seconds++;$("time").textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")}
function start(){clearInterval(timer);seconds=tries=matches=0;first=null;lock=false;$("pairs").textContent="0/8";$("tries").textContent="0";$("time").textContent="0:00";$("status").textContent="Toque em duas cartas para encontrar os pares!";$("fact").textContent="Cada par revela uma curiosidade animal.";deck=shuffle(animals.flatMap((a,i)=>[{id:i,copy:0},{id:i,copy:1}]));$("grid").innerHTML="";deck.forEach((item,index)=>{const b=document.createElement("button");b.className="card";b.setAttribute("aria-label","Carta fechada");b.innerHTML='<span class="backmark">✦</span><span class="face"><span>'+animals[item.id][0]+'</span><small>'+animals[item.id][1]+'</small></span>';b.addEventListener("click",()=>flip(b,item));$("grid").append(b);});timer=setInterval(tick,1000)}
function flip(btn,item){if(lock||btn.classList.contains("open")||btn.classList.contains("matched"))return;btn.classList.add("open");btn.setAttribute("aria-label",animals[item.id][1]);if(!first){first={btn,item};return;}tries++;$("tries").textContent=tries;if(first.item.id===item.id){btn.classList.add("matched");first.btn.classList.add("matched");matches++;$("pairs").textContent=matches+"/8";$("fact").textContent=animals[item.id][2];$("status").textContent="Boa! Você encontrou um par.";first=null;if(matches===8){clearInterval(timer);$("status").textContent="🌟 Missão cumprida! Você encontrou todos os animais em "+tries+" tentativas.";}}else{lock=true;$("status").textContent="Quase! Tente lembrar onde cada animal está.";const previous=first.btn;first=null;setTimeout(()=>{btn.classList.remove("open");previous.classList.remove("open");lock=false;},850)}}
$("restart").addEventListener("click",start);start();
</script></body></html>
