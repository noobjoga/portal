<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Black - PS2 Remake HD</title>
  <style>
    :root {
      --amber: #e7bd42;
      --amber-hot: #ffdb69;
      --glass: rgba(8, 12, 15, 0.74);
      --line: rgba(231, 189, 66, 0.34);
      --muted: #9aa2a7;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050607;
      color: #fff;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      user-select: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at center, transparent 43%, rgba(0,0,0,.2) 70%, rgba(0,0,0,.72) 115%),
        linear-gradient(180deg, rgba(4,8,10,.2), transparent 40%, rgba(0,0,0,.24));
      mix-blend-mode: multiply;
    }

    body::after {
      opacity: .13;
      background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px);
    }

    canvas { display: block; }

    /* TELA DE ABERTURA CINEMATOGRÁFICA */
    #intro-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      transition: opacity 1s ease, filter 1s ease;
    }

    #intro-screen::before {
      content: "";
      position: absolute;
      width: 60vw;
      height: 150vh;
      left: -9vw;
      top: -28vh;
      z-index: 0;
      opacity: .42;
      transform: rotate(19deg);
      background: linear-gradient(90deg, transparent, rgba(226,185,63,.15), transparent 74%);
      filter: blur(20px);
    }

    #intro-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.75), transparent 22%, transparent 78%, rgba(0,0,0,.75)),
        radial-gradient(circle at center, transparent 10%, rgba(0,0,0,.78) 105%);
    }

    #grid-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .title-box {
      position: relative;
      z-index: 2;
      min-width: min(680px, 92vw);
      padding: 48px 56px 42px;
      text-align: center;
      border-top: 1px solid rgba(231,189,66,.35);
      border-bottom: 1px solid rgba(231,189,66,.17);
      background: linear-gradient(90deg, transparent, rgba(5,8,10,.62) 18%, rgba(5,8,10,.74) 50%, rgba(5,8,10,.62) 82%, transparent);
      box-shadow: 0 28px 80px rgba(0,0,0,.55);
    }

    .title-box::before {
      content: "MAZE LOOP  /  APRESENTA";
      display: block;
      margin-bottom: 16px;
      color: rgba(255,255,255,.42);
      font: 700 10px/1 Arial, sans-serif;
      letter-spacing: 5px;
    }

    .title-box h1 {
      margin: 0;
      color: var(--amber);
      font-size: clamp(64px, 9vw, 112px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: clamp(8px, 1.4vw, 20px);
      text-indent: clamp(8px, 1.4vw, 20px);
      text-shadow:
        0 2px 0 #ffe17e,
        0 7px 0 #5e4812,
        0 12px 22px rgba(0,0,0,.92),
        0 0 42px rgba(231,189,66,.38);
      animation: pulseGlow 2.6s infinite alternate ease-in-out;
    }

    .title-box p {
      margin: 16px 0 42px;
      color: #889198;
      font: 700 12px/1 Arial, sans-serif;
      letter-spacing: 7px;
      text-indent: 7px;
    }

    .start-btn {
      position: relative;
      min-width: 248px;
      padding: 16px 34px;
      overflow: hidden;
      cursor: pointer;
      color: #0b0c0d;
      background: linear-gradient(180deg, #f1cf62 0%, #c49324 58%, #8e6413 100%);
      border: 1px solid #ffe7a0;
      border-radius: 2px;
      font: 900 15px/1 Arial, sans-serif;
      letter-spacing: 3px;
      box-shadow: 0 0 0 4px rgba(0,0,0,.52), 0 0 28px rgba(230,194,0,.28), inset 0 1px 0 rgba(255,255,255,.8);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .start-btn::after {
      content: "";
      position: absolute;
      top: -80%;
      left: -25%;
      width: 30%;
      height: 260%;
      transform: rotate(22deg);
      background: rgba(255,255,255,.38);
      transition: left .42s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.025);
      filter: saturate(1.1) brightness(1.1);
      box-shadow: 0 0 0 4px rgba(0,0,0,.52), 0 0 38px rgba(230,194,0,.48), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .start-btn:hover::after { left: 110%; }
    .start-btn:active { transform: translateY(1px) scale(.99); }

    @keyframes pulseGlow {
      from { filter: brightness(.92); }
      to { filter: brightness(1.1); }
    }

    /* HUD: apenas acabamento visual; os mesmos dados continuam sendo usados. */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(0,0,0,.9), inset 0 0 4px rgba(0,0,0,.7);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 5px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #ffd96a;
      box-shadow: 0 0 6px #ffb300;
    }

    #crosshair::before {
      top: -8px;
      left: 5px;
      width: 1px;
      height: 5px;
      border-radius: 0;
      background: rgba(255,255,255,.72);
      box-shadow: 0 23px 0 rgba(255,255,255,.72);
    }

    #hitmarker {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 12;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.55) rotate(45deg);
      transition: opacity .045s linear, transform .08s ease-out;
    }

    #hitmarker::before,
    #hitmarker::after {
      content: "";
      position: absolute;
      top: 13px;
      left: 2px;
      width: 24px;
      height: 2px;
      background: #fff;
      box-shadow: 0 1px 4px #000;
    }

    #hitmarker::after { transform: rotate(90deg); }

    #hitmarker.active {
      opacity: .96;
      transform: scale(1) rotate(45deg);
    }

    #hitmarker.headshot::before,
    #hitmarker.headshot::after { background: #ffd35c; }

    #ui,
    #weapon-hud {
      position: absolute;
      bottom: 24px;
      z-index: 10;
      min-width: 230px;
      padding: 14px 17px 13px;
      color: #e8ecee;
      border: 1px solid rgba(255,255,255,.09);
      border-top-color: var(--line);
      background:
        linear-gradient(135deg, rgba(231,189,66,.08), transparent 44%),
        var(--glass);
      box-shadow: 0 14px 36px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.025);
      backdrop-filter: blur(8px);
      text-shadow: 0 2px 4px #000;
      font: 800 13px/1.65 Arial, sans-serif;
      letter-spacing: 1.8px;
    }

    #ui { left: 24px; }

    #weapon-hud {
      right: 24px;
      min-width: 300px;
      text-align: right;
    }

    #ui::before,
    #weapon-hud::before {
      content: "STATUS OPERACIONAL";
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font: 700 9px/1 Arial, sans-serif;
      letter-spacing: 2.4px;
    }

    #weapon-hud::before { content: "SISTEMA DE ARMAMENTO"; }
    #health, #ammo, #weapon-name { color: var(--amber-hot) !important; }

    #weapon-hud small {
      color: #7f888e !important;
      font: 700 9px/1.4 Arial, sans-serif !important;
      letter-spacing: 1px;
    }

    #mission-tag {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 9px 13px;
      color: rgba(255,255,255,.62);
      border-left: 2px solid var(--amber);
      background: linear-gradient(90deg, rgba(3,6,8,.7), transparent);
      font: 700 9px/1 Arial, sans-serif;
      letter-spacing: 2.5px;
      text-shadow: 0 1px 3px #000;
    }

    @media (max-width: 700px) {
      .title-box { min-width: 94vw; padding: 38px 20px 34px; }
      .title-box p { font-size: 9px; letter-spacing: 4px; }
      #ui, #weapon-hud { bottom: 12px; min-width: 0; padding: 10px 11px; font-size: 10px; }
      #ui { left: 12px; }
      #weapon-hud { right: 12px; max-width: 54vw; }
      #weapon-hud small { display: none; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- TELA DE ABERTURA COM O DESIGN DA IMAGEM -->
  <div id="intro-screen">
    <canvas id="grid-bg"></canvas>
    <div class="title-box">
      <h1>BLACK</h1>
      <p>TACTICAL WEB REMAKE</p>
      <button class="start-btn" id="start-btn">INICIAR MISSAO</button>
    </div>
  </div>

  <div id="mission-tag">OPERAÇÃO BLACKOUT&nbsp;&nbsp;•&nbsp;&nbsp;SETOR URBANO</div>
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="ui">
    SAÚDE: <span id="health" style="color:#00ff55">100</span>% <br>
    MUNIÇÃO: <span id="ammo">30</span> / ∞
  </div>
  <div id="weapon-hud">
    ARMA: <span id="weapon-name" style="color:#e6c200">FUZIL TÁTICO</span><br>
    <small style="font-size:12px; color:#aaa;">[1] Fuzil &nbsp; [2] Pistola &nbsp; [3] Sniper &nbsp; [4] Karambit</small>
  </div>

  <script>
    // --- DESENHO DA GRADE DA IMAGEM EM CANVAS ---
    const gridCanvas = document.getElementById('grid-bg');
    const ctx = gridCanvas.getContext('2d');

    function drawGridBackground() {
      gridCanvas.width = window.innerWidth;
      gridCanvas.height = window.innerHeight;

      // Fundo tático procedural: não depende de imagens externas.
      const background = ctx.createRadialGradient(
        gridCanvas.width * 0.52, gridCanvas.height * 0.44, 0,
        gridCanvas.width * 0.52, gridCanvas.height * 0.44, Math.max(gridCanvas.width, gridCanvas.height) * 0.78
      );
      background.addColorStop(0, '#11171c');
      background.addColorStop(0.5, '#080c10');
      background.addColorStop(1, '#020304');
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);

      const tileSize = 32;
      ctx.strokeStyle = 'rgba(93, 111, 121, .10)';
      ctx.lineWidth = 1;

      for (let x = 0; x < gridCanvas.width; x += tileSize) {
        for (let y = 0; y < gridCanvas.height; y += tileSize) {
          ctx.strokeRect(x, y, tileSize, tileSize);
          ctx.fillStyle = 'rgba(255, 255, 255, .025)';
          ctx.fillRect(x + 1, y + 1, 2, 2);
        }
      }

      ctx.save();
      ctx.globalAlpha = .28;
      ctx.strokeStyle = '#d1a62f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, gridCanvas.height * .78);
      ctx.lineTo(gridCanvas.width, gridCanvas.height * .42);
      ctx.stroke();
      ctx.restore();

      // Granulação extremamente leve para quebrar o aspecto chapado.
      ctx.globalAlpha = .05;
      for (let i = 0; i < Math.min(5500, gridCanvas.width * gridCanvas.height / 180); i++) {
        const shade = Math.random() > .5 ? 255 : 0;
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.fillRect(Math.random() * gridCanvas.width, Math.random() * gridCanvas.height, 1, 1);
      }
      ctx.globalAlpha = 1;
    }
    drawGridBackground();
    window.addEventListener('resize', drawGridBackground);

    // --- MOTOR DO JOGO THREE.JS ---
    let scene, camera, renderer;
    let currentWeapon = 'rifle';
    let rifleGroup, pistolGroup, sniperGroup, karambitGroup, activeWeaponGroup;
    let muzzleFlash, muzzleLight;
    
    let playerHealth = 100;
    let ammo = 30;
    let isLocked = false;
    let gameStarted = false;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();
    let raycaster = new THREE.Raycaster();

    let pitch = 0, yaw = 0;
    let enemies = [];
    let buildingColliders = [];
    let shotObstacles = [];
    let visualEffects = [];
    let dustField;
    let lastShotAt = 0;
    let hitmarkerTimer;

    const playerCollisionRadius = .42;
    const weaponAmmo = { rifle: 30, pistol: 15, sniper: 5, karambit: Infinity };
    const weaponStats = {
      rifle: { name: 'FUZIL TÁTICO', damage: 34, cooldown: 105, range: 180, recoilZ: .08, recoilPitch: .012 },
      pistol: { name: 'PISTOLA TÁTICA', damage: 46, cooldown: 235, range: 120, recoilZ: .065, recoilPitch: .016 },
      sniper: { name: 'SNIPER M82', damage: 115, cooldown: 820, range: 320, recoilZ: .12, recoilPitch: .032 },
      karambit: { name: 'KARAMBIT', damage: 72, cooldown: 430, range: 2.35, recoilZ: 0, recoilPitch: 0 }
    };

    const visualMaterials = {};
    const visualGeometries = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playGunshotSound(isPistol = false) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const bufferSize = audioCtx.sampleRate * (isPistol ? 0.25 : 0.38);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(isPistol ? 1600 : 1000, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + (isPistol ? 0.2 : 0.3));

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(isPistol ? 1.4 : 2.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (isPistol ? 0.22 : 0.35));

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // ---------------------------------------------------------------------
    // CAMADA VISUAL HD. As funções abaixo criam texturas, luzes e detalhes;
    // nenhuma delas altera movimentação, mira, dano ou comportamento inimigo.
    // ---------------------------------------------------------------------
    function createNoiseTexture(baseColor, fleckColor, size = 256, density = 7500, streaks = false) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const textureCtx = canvas.getContext('2d');

      textureCtx.fillStyle = baseColor;
      textureCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < density; i++) {
        const alpha = Math.random() * 0.12;
        textureCtx.globalAlpha = alpha;
        textureCtx.fillStyle = Math.random() > 0.35 ? fleckColor : '#000000';
        const pixel = Math.random() > .93 ? 2 : 1;
        textureCtx.fillRect(Math.random() * size, Math.random() * size, pixel, pixel);
      }

      if (streaks) {
        textureCtx.globalAlpha = .16;
        for (let i = 0; i < 65; i++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          const length = 8 + Math.random() * 52;
          textureCtx.strokeStyle = Math.random() > .35 ? '#0a0b0c' : '#9b8a68';
          textureCtx.lineWidth = .5 + Math.random();
          textureCtx.beginPath();
          textureCtx.moveTo(x, y);
          textureCtx.lineTo(x + (Math.random() - .5) * 4, y + length);
          textureCtx.stroke();
        }
      }

      textureCtx.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = 8;
      return texture;
    }

    function prepareVisualLibrary() {
      const concreteTexture = createNoiseTexture('#4a4844', '#8a8377', 256, 9000, true);
      concreteTexture.repeat.set(3, 3);
      const asphaltTexture = createNoiseTexture('#25282a', '#73797c', 256, 12500, false);
      asphaltTexture.repeat.set(36, 36);
      const metalTexture = createNoiseTexture('#25282a', '#6a7074', 128, 2800, true);

      visualMaterials.concrete = new THREE.MeshStandardMaterial({
        color: 0x8b8880,
        map: concreteTexture,
        roughness: .92,
        metalness: .02
      });
      visualMaterials.asphalt = new THREE.MeshStandardMaterial({
        color: 0x777b7d,
        map: asphaltTexture,
        roughness: .95,
        metalness: .01
      });
      visualMaterials.darkMetal = new THREE.MeshStandardMaterial({
        color: 0x1b1d1f,
        map: metalTexture,
        roughness: .5,
        metalness: .72
      });
      visualMaterials.rustedMetal = new THREE.MeshStandardMaterial({
        color: 0x59483b,
        map: metalTexture,
        roughness: .78,
        metalness: .42
      });
      visualMaterials.window = new THREE.MeshStandardMaterial({
        color: 0x11191d,
        roughness: .18,
        metalness: .45,
        emissive: 0x101612,
        emissiveIntensity: .28
      });
      visualMaterials.windowWarm = new THREE.MeshStandardMaterial({
        color: 0x493a22,
        roughness: .24,
        metalness: .2,
        emissive: 0x8d5c19,
        emissiveIntensity: .55
      });
      visualMaterials.roadPaint = new THREE.MeshStandardMaterial({
        color: 0xb4ad8a,
        roughness: .88,
        metalness: 0
      });
      visualMaterials.black = new THREE.MeshStandardMaterial({
        color: 0x0a0b0c,
        roughness: .74,
        metalness: .28
      });

      visualGeometries.window = new THREE.BoxGeometry(1.25, 1.5, .08);
      visualGeometries.frameH = new THREE.BoxGeometry(1.42, .08, .11);
      visualGeometries.frameV = new THREE.BoxGeometry(.08, 1.62, .11);
      visualGeometries.rubble = new THREE.DodecahedronGeometry(.22, 0);
    }

    function configureMesh(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      return mesh;
    }

    function createSkyDome() {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 512;
      const skyCtx = canvas.getContext('2d');
      const gradient = skyCtx.createLinearGradient(0, 0, 0, 512);
      gradient.addColorStop(0, '#07121b');
      gradient.addColorStop(.36, '#243844');
      gradient.addColorStop(.62, '#786b57');
      gradient.addColorStop(1, '#1a1c1c');
      skyCtx.fillStyle = gradient;
      skyCtx.fillRect(0, 0, 16, 512);

      const skyTexture = new THREE.CanvasTexture(canvas);
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(420, 32, 18),
        new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide, fog: false })
      );
      sky.position.y = -70;
      scene.add(sky);

      const sunDisc = new THREE.Mesh(
        new THREE.CircleGeometry(10, 32),
        new THREE.MeshBasicMaterial({ color: 0xe8c987, transparent: true, opacity: .52, fog: false })
      );
      sunDisc.position.set(100, 90, -250);
      sunDisc.lookAt(0, 20, 0);
      scene.add(sunDisc);
    }

    function createAtmosphericDust() {
      const count = 650;
      const points = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        points[i * 3] = (Math.random() - .5) * 170;
        points[i * 3 + 1] = .2 + Math.random() * 17;
        points[i * 3 + 2] = 15 - Math.random() * 155;
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(points, 3));
      const material = new THREE.PointsMaterial({
        color: 0xc0ad89,
        size: .055,
        transparent: true,
        opacity: .3,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      dustField = new THREE.Points(geometry, material);
      scene.add(dustField);
    }

    function createStreetLight(x, z, rotation = 0) {
      const group = new THREE.Group();
      const pole = configureMesh(new THREE.Mesh(new THREE.CylinderGeometry(.08, .11, 5.8, 10), visualMaterials.darkMetal));
      pole.position.y = 2.9;
      group.add(pole);

      const arm = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(.08, .08, 1.3), visualMaterials.darkMetal));
      arm.position.set(0, 5.65, -.57);
      group.add(arm);

      const hood = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(.52, .16, .72), visualMaterials.darkMetal));
      hood.position.set(0, 5.56, -1.18);
      group.add(hood);

      const lampMat = new THREE.MeshBasicMaterial({ color: 0xf1d493 });
      const lamp = new THREE.Mesh(new THREE.PlaneGeometry(.36, .46), lampMat);
      lamp.rotation.x = Math.PI / 2;
      lamp.position.set(0, 5.46, -1.18);
      group.add(lamp);

      const light = new THREE.PointLight(0xffd89a, 1.1, 18, 2.2);
      light.position.set(0, 5.25, -1.16);
      group.add(light);

      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      scene.add(group);
    }

    function createPuddle(x, z, width, depth, rotation = 0) {
      const puddle = new THREE.Mesh(
        new THREE.CircleGeometry(1, 32),
        new THREE.MeshStandardMaterial({
          color: 0x1a2529,
          roughness: .08,
          metalness: .15,
          transparent: true,
          opacity: .58
        })
      );
      puddle.scale.set(width, depth, 1);
      puddle.rotation.x = -Math.PI / 2;
      puddle.rotation.z = rotation;
      puddle.position.set(x, .012, z);
      puddle.receiveShadow = true;
      scene.add(puddle);
    }

    function scatterRubble(x, z, spreadX, spreadZ, amount) {
      for (let i = 0; i < amount; i++) {
        const material = Math.random() > .28 ? visualMaterials.concrete : visualMaterials.rustedMetal;
        const piece = configureMesh(new THREE.Mesh(visualGeometries.rubble, material));
        const scale = .35 + Math.random() * .95;
        piece.scale.set(scale * (1 + Math.random()), scale * .55, scale);
        piece.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);

    function createBuilding(x, z, width, height, depth) {
      const buildingGroup = new THREE.Group();
      const body = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), visualMaterials.concrete));
      body.position.y = height / 2;
      body.userData.blocksShots = true;
      shotObstacles.push(body);
      buildingGroup.add(body);

      const bodyEdges = new THREE.LineSegments(
        new THREE.EdgesGeometry(body.geometry, 28),
        new THREE.LineBasicMaterial({ color: 0x17191a, transparent: true, opacity: .46 })
      );
      bodyEdges.position.copy(body.position);
      buildingGroup.add(bodyEdges);

      const foundation = configureMesh(new THREE.Mesh(
        new THREE.BoxGeometry(width + .28, .32, depth + .28),
        new THREE.MeshStandardMaterial({ color: 0x252626, roughness: 1 })
      ));
      foundation.position.y = .16;
      buildingGroup.add(foundation);

      const roofLip = configureMesh(new THREE.Mesh(
        new THREE.BoxGeometry(width + .42, .28, depth + .42),
        visualMaterials.rustedMetal
      ));
      roofLip.position.y = height + .08;
      buildingGroup.add(roofLip);

      // Porta na mesma posição e com o mesmo tamanho básico do original.
      const door = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, .12), visualMaterials.darkMetal));
      door.position.set(0, 1.4, depth / 2 + .07);
      buildingGroup.add(door);

      const doorInset = new THREE.Mesh(
        new THREE.BoxGeometry(1.24, 2.42, .04),
        new THREE.MeshStandardMaterial({ color: 0x2e3335, roughness: .67, metalness: .62 })
      );
      doorInset.position.set(0, 1.45, depth / 2 + .145);
      buildingGroup.add(doorInset);

      const handle = configureMesh(new THREE.Mesh(new THREE.SphereGeometry(.055, 8, 8), visualMaterials.rustedMetal));
      handle.position.set(.46, 1.42, depth / 2 + .19);
      buildingGroup.add(handle);

      const floors = Math.max(2, Math.floor(height / 3.1));
      const columns = Math.max(2, Math.min(5, Math.floor(width / 3)));

      for (let row = 0; row < floors; row++) {
        const windowY = 2.2 + row * 2.75;
        if (windowY > height - .9) continue;
        for (let col = 0; col < columns; col++) {
          const windowX = -width * .5 + 1.6 + col * ((width - 3.2) / Math.max(1, columns - 1));
          if (Math.abs(windowX) < 1.1 && row === 0) continue;
          const lit = ((row + col + Math.round(Math.abs(x))) % 6 === 0);
          const window = configureMesh(new THREE.Mesh(
            visualGeometries.window,
            lit ? visualMaterials.windowWarm : visualMaterials.window
          ), false, true);
          window.position.set(windowX, windowY, depth / 2 + .08);
          buildingGroup.add(window);

          const topFrame = configureMesh(new THREE.Mesh(visualGeometries.frameH, visualMaterials.darkMetal));
          const bottomFrame = topFrame.clone();
          topFrame.position.set(windowX, windowY + .79, depth / 2 + .14);
          bottomFrame.position.set(windowX, windowY - .79, depth / 2 + .14);
          buildingGroup.add(topFrame, bottomFrame);

          const sideFrameL = configureMesh(new THREE.Mesh(visualGeometries.frameV, visualMaterials.darkMetal));
          const sideFrameR = sideFrameL.clone();
          sideFrameL.position.set(windowX - .67, windowY, depth / 2 + .14);
          sideFrameR.position.set(windowX + .67, windowY, depth / 2 + .14);
          buildingGroup.add(sideFrameL, sideFrameR);

          const crossbar = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(1.25, .045, .12), visualMaterials.darkMetal));
          crossbar.position.set(windowX, windowY, depth / 2 + .145);
          buildingGroup.add(crossbar);
        }
      }

      // Tubulação, caixa elétrica e aparelho externo quebram a silhueta chapada.
      const pipe = configureMesh(new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, Math.min(height - 1, 8), 10), visualMaterials.rustedMetal));
      pipe.position.set(width / 2 - .65, Math.min(height / 2, 4.5), depth / 2 + .13);
      buildingGroup.add(pipe);

      const meter = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(.65, .9, .28), visualMaterials.darkMetal));
      meter.position.set(-width / 2 + .9, 1.2, depth / 2 + .2);
      buildingGroup.add(meter);

      const acUnit = configureMesh(new THREE.Mesh(new THREE.BoxGeometry(1.35, .72, .52), visualMaterials.rustedMetal));
      acUnit.position.set(width / 2 - 1.35, Math.min(height - 1.25, 4.1), depth / 2 + .33);
      buildingGroup.add(acUnit);

      for (let i = 0; i < 5; i++) {
        const grille = new THREE.Mesh(new THREE.BoxGeometry(.95, .035, .055), visualMaterials.black);
        grille.position.set(acUnit.position.x, acUnit.position.y - .22 + i * .11, depth / 2 + .61);
        buildingGroup.add(grille);
      }

      const roofTank = configureMesh(new THREE.Mesh(new THREE.CylinderGeometry(.7, .85, 1.35, 14), visualMaterials.rustedMetal));
      roofTank.position.set(-width * .22, height + .82, -depth * .18);
      buildingGroup.add(roofTank);

      buildingGroup.position.set(x, 0, z);
      scene.add(buildingGroup);

      // Colisor horizontal fiel ao volume visível do prédio.
      buildingColliders.push({
        minX: x - width / 2,
        maxX: x + width / 2,
        minZ: z - depth / 2,
        maxZ: z + depth / 2
      });
    }

        [38, -138, 28, 42, 22], [68, -118, 22, 32, 18]
      ];
      skyline.forEach(([sx, sz, sw, sh, sd]) => {

        block.position.set(sx, sh / 2, sz);

    function isBlockedByBuilding(x, z) {
      return buildingColliders.some(collider => (
        x > collider.minX - playerCollisionRadius &&
        x < collider.maxX + playerCollisionRadius &&
        z > collider.minZ - playerCollisionRadius &&
        z < collider.maxZ + playerCollisionRadius
      ));
    }

    function resolveBuildingCollisions(previousPosition) {
      const desiredX = camera.position.x;
      const desiredZ = camera.position.z;

      // Resolve cada eixo separadamente para o jogador deslizar pela parede.
      camera.position.x = isBlockedByBuilding(desiredX, previousPosition.z)
        ? previousPosition.x
        : desiredX;
      camera.position.z = isBlockedByBuilding(camera.position.x, desiredZ)
        ? previousPosition.z
        : desiredZ;
    }

    function updateWeaponHud() {
      const stats = weaponStats[currentWeapon];
      document.getElementById('weapon-name').innerText = stats.name;
      document.getElementById('ammo').innerText = currentWeapon === 'karambit' ? '∞' : weaponAmmo[currentWeapon];
    }

    function switchWeapon(nextWeapon) {
      const groups = {
        rifle: rifleGroup,
        pistol: pistolGroup,
        sniper: sniperGroup,
        karambit: karambitGroup
      };
      const nextGroup = groups[nextWeapon];
      if (!nextGroup || !camera) return;

      if (activeWeaponGroup && activeWeaponGroup.parent === camera) camera.remove(activeWeaponGroup);
      currentWeapon = nextWeapon;
      activeWeaponGroup = nextGroup;
      activeWeaponGroup.position.copy(activeWeaponGroup.userData.basePosition);
      activeWeaponGroup.rotation.copy(activeWeaponGroup.userData.baseRotation);
      camera.add(activeWeaponGroup);

      muzzleFlash = activeWeaponGroup.userData.muzzleFlash || null;
      muzzleLight = muzzleFlash ? muzzleFlash.userData.light : null;
      ammo = currentWeapon === 'karambit' ? Infinity : weaponAmmo[currentWeapon];

      if (currentWeapon === 'karambit') {
        karambitGroup.userData.inspectStart = performance.now();
        karambitGroup.userData.slashStart = -1;
      }
      updateWeaponHud();
    }

    function setupEvents() {
      const startBtn = document.getElementById('start-btn');
      const introScreen = document.getElementById('intro-screen');

      startBtn.addEventListener('click', () => {
        gameStarted = true;
        introScreen.style.opacity = '0';
        setTimeout(() => introScreen.style.display = 'none', 1000);
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        isLocked = (document.pointerLockElement === document.body);
      });

      document.addEventListener('mousemove', (e) => {
        if (!isLocked) return;
        const sensitivity = 0.002;
        yaw -= e.movementX * sensitivity;
        pitch -= e.movementY * sensitivity;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        camera.rotation.x = pitch;
        camera.rotation.y = yaw;
        camera.rotation.z = 0;
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
        if (e.code === 'Digit1') switchWeapon('rifle');
        if (e.code === 'Digit2') switchWeapon('pistol');
        if (e.code === 'Digit3') switchWeapon('sniper');
        if (e.code === 'Digit4') switchWeapon('karambit');
      });

      document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
      });

      document.addEventListener('mousedown', (e) => {
        if (isLocked && e.button === 0) shoot();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    }

    function showHitmarker(headshot = false) {
      const marker = document.getElementById('hitmarker');
      marker.classList.remove('active', 'headshot');
      void marker.offsetWidth;
      if (headshot) marker.classList.add('headshot');
      marker.classList.add('active');
      clearTimeout(hitmarkerTimer);
      hitmarkerTimer = setTimeout(() => marker.classList.remove('active', 'headshot'), 95);
    }

    function spawnImpactParticles(point, color = 0xb4452d) {
      for (let i = 0; i < 8; i++) {
        const particle = new THREE.Mesh(
          new THREE.SphereGeometry(.018 + Math.random() * .022, 5, 5),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .9, depthWrite: false })
        );
        particle.position.copy(point);
        particle.userData = {
          kind: 'impact',
          age: 0,
          life: .22 + Math.random() * .18,
          velocity: new THREE.Vector3(
            (Math.random() - .5) * 1.7,
            .25 + Math.random() * 1.15,
            (Math.random() - .5) * 1.7
          )
        };
        scene.add(particle);
        visualEffects.push(particle);
      }
    }

    function spawnTracer(endPoint) {
      if (!muzzleFlash) return;
      const startPoint = new THREE.Vector3();
      muzzleFlash.getWorldPosition(startPoint);
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([startPoint, endPoint]),
        new THREE.LineBasicMaterial({ color: 0xffd06a, transparent: true, opacity: .68 })
      );
      line.userData = { kind: 'tracer', age: 0, life: .065 };
      scene.add(line);
      visualEffects.push(line);
    }

    function performWeaponHit(stats) {
      scene.updateMatrixWorld(true);
      camera.updateMatrixWorld(true);
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.near = 0;
      raycaster.far = stats.range;

      const liveEnemies = enemies.filter(enemy => enemy.userData.alive);
      const intersections = raycaster.intersectObjects([...liveEnemies, ...shotObstacles], true);
      const endPoint = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(stats.range));

      if (!intersections.length) {
        if (currentWeapon !== 'karambit') spawnTracer(endPoint);
        return;
      }

      const hit = intersections[0];
      if (currentWeapon !== 'karambit') spawnTracer(hit.point);

      const enemy = hit.object.userData.enemyRoot;
      if (!enemy || !enemy.userData.alive) {
        if (hit.object.userData.blocksShots) spawnImpactParticles(hit.point, 0xffb34a);
        return;
      }

      const headshot = hit.object.userData.hitZone === 'head';
      const damage = Math.round(stats.damage * (headshot ? 1.8 : 1));
      enemy.userData.health = Math.max(0, enemy.userData.health - damage);
      enemy.userData.hitPulse = 1;
      showHitmarker(headshot);
      spawnImpactParticles(hit.point, headshot ? 0xc9482e : 0x9f3828);

      if (enemy.userData.health <= 0) {
        enemy.userData.alive = false;
        enemy.userData.deathProgress = 0;
        enemy.userData.deathSide = Math.random() > .5 ? 1 : -1;
      }
    }

    function playKnifeSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = 'sawtooth';
      oscillator.frequency.setValueAtTime(420, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(95, audioCtx.currentTime + .12);
      gain.gain.setValueAtTime(.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .13);
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + .14);
    }

    function spawnMuzzleSmoke(sourceFlash = muzzleFlash) {
      const worldPosition = new THREE.Vector3();
      const forward = new THREE.Vector3();

      camera.getWorldDirection(forward);

    function shoot() {
      const stats = weaponStats[currentWeapon];
      const now = performance.now();
      if (now - lastShotAt < stats.cooldown) return;

      if (currentWeapon === 'karambit') {
        lastShotAt = now;
        karambitGroup.userData.slashStart = now;
        playKnifeSound();
        performWeaponHit(stats);
        return;
      }

      ammo = weaponAmmo[currentWeapon];
      if (ammo <= 0) return;
      lastShotAt = now;
      weaponAmmo[currentWeapon]--;
      ammo = weaponAmmo[currentWeapon];
      document.getElementById('ammo').innerText = ammo;
      playGunshotSound(currentWeapon === 'pistol');

      const shotFlash = muzzleFlash;
      const shotLight = muzzleLight;
      shotLight.intensity = currentWeapon === 'sniper' ? 18 : 13;
      shotFlash.material.opacity = 1;
      shotFlash.userData.core.material.opacity = 1;
      shotFlash.rotation.z = Math.random() * Math.PI;
      spawnMuzzleSmoke(shotFlash);
      ejectCasing();
      performWeaponHit(stats);
      setTimeout(() => {
        shotLight.intensity = 0;
        shotFlash.material.opacity = 0;
        shotFlash.userData.core.material.opacity = 0;
      }, 55);

      // O recuo aprovado do fuzil permanece .08 / .012.
      activeWeaponGroup.position.z += stats.recoilZ;
      pitch += stats.recoilPitch;
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (isLocked && gameStarted) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 130.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 130.0 * delta;

        const previousPosition = camera.position.clone();
        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        resolveBuildingCollisions(previousPosition);
        camera.position.y = 1.65;

        const basePosition = activeWeaponGroup.userData.basePosition;
        const baseRotation = activeWeaponGroup.userData.baseRotation;

        if (currentWeapon === 'karambit') {
          const slashAge = time - (karambitGroup.userData.slashStart || -1000);
          const inspectAge = time - (karambitGroup.userData.inspectStart || -1000);

          if (slashAge >= 0 && slashAge < 430) {
            const t = slashAge / 430;
            const arc = Math.sin(t * Math.PI);
            karambitGroup.rotation.x = baseRotation.x - arc * .62;
            karambitGroup.rotation.y = baseRotation.y - arc * .9;
            karambitGroup.rotation.z = baseRotation.z + arc * .72;
            karambitGroup.position.x = basePosition.x - arc * .19;
            karambitGroup.position.y = basePosition.y + arc * .12;
          } else if (inspectAge >= 0 && inspectAge < 720) {
            const t = inspectAge / 720;
            const eased = 1 - Math.pow(1 - t, 3);
            karambitGroup.rotation.x = baseRotation.x + Math.sin(t * Math.PI) * .18;
            karambitGroup.rotation.y = baseRotation.y + Math.sin(t * Math.PI) * .38;
            karambitGroup.rotation.z = baseRotation.z + eased * Math.PI * 2;
            karambitGroup.position.y = basePosition.y + Math.sin(t * Math.PI) * .1;
          } else {
            if (karambitGroup.userData.inspectStart > 0 && inspectAge >= 720) {
              karambitGroup.position.copy(basePosition);
              karambitGroup.rotation.copy(baseRotation);
              karambitGroup.userData.inspectStart = -1;
            }
            karambitGroup.position.lerp(basePosition, .24);
            karambitGroup.rotation.x += (baseRotation.x - karambitGroup.rotation.x) * .24;
            karambitGroup.rotation.y += (baseRotation.y - karambitGroup.rotation.y) * .24;
            karambitGroup.rotation.z += (baseRotation.z - karambitGroup.rotation.z) * .24;
          }
        } else {
          activeWeaponGroup.position.z += (basePosition.z - activeWeaponGroup.position.z) * .18;
        }

        enemies.forEach(enemy => {
          if (enemy.userData.alive) {
            enemy.lookAt(camera.position.x, 0, camera.position.z);
            if (enemy.position.distanceTo(camera.position) > 6) {
              enemy.userData.walkTimer += delta * 7.5;
              const stride = Math.sin(enemy.userData.walkTimer) * .23;
              enemy.userData.legR.rotation.x = stride;
              enemy.userData.legL.rotation.x = -stride;
              enemy.userData.armR.rotation.z = -.22 - stride * .14;
              enemy.userData.armL.rotation.z = .32 + stride * .14;
              enemy.translateZ(1.8 * delta);
            } else {
              enemy.userData.legR.rotation.x *= .82;
              enemy.userData.legL.rotation.x *= .82;
            }
          } else {
            enemy.userData.deathProgress = Math.min(1, enemy.userData.deathProgress + delta * 1.9);
            const fall = 1 - Math.pow(1 - enemy.userData.deathProgress, 3);
            enemy.rotation.x = -fall * Math.PI * .48;
            enemy.rotation.z = fall * .12 * enemy.userData.deathSide;
          }
        });
      }

      // Atualizações puramente visuais: poeira, fumaça e cartuchos.
      const visualDelta = Math.min(delta, .05);
      if (dustField) {
        dustField.rotation.y = time * .000006;
        dustField.position.y = Math.sin(time * .00012) * .12;
      }

      for (let i = visualEffects.length - 1; i >= 0; i--) {
        const effect = visualEffects[i];
        effect.userData.age += visualDelta;

        if (effect.userData.kind === 'smoke') {
          effect.position.addScaledVector(effect.userData.velocity, visualDelta);
          const progress = effect.userData.age / effect.userData.life;
          effect.scale.setScalar(1 + progress * 3.2);
          effect.material.opacity = Math.max(0, .16 * (1 - progress));
        } else if (effect.userData.kind === 'casing') {
          effect.userData.velocity.y -= 5.8 * visualDelta;
          effect.position.addScaledVector(effect.userData.velocity, visualDelta);
          effect.rotation.x += effect.userData.spin.x * visualDelta;
          effect.rotation.y += effect.userData.spin.y * visualDelta;
          effect.rotation.z += effect.userData.spin.z * visualDelta;
          if (effect.position.y < .045) {
            effect.position.y = .045;
            effect.userData.velocity.y = Math.abs(effect.userData.velocity.y) * .23;
            effect.userData.velocity.multiplyScalar(.78);
          }
        } else if (effect.userData.kind === 'impact') {
          effect.userData.velocity.y -= 3.8 * visualDelta;
          effect.position.addScaledVector(effect.userData.velocity, visualDelta);
          effect.material.opacity = Math.max(0, .9 * (1 - effect.userData.age / effect.userData.life));
        } else if (effect.userData.kind === 'tracer') {
          effect.material.opacity = Math.max(0, .68 * (1 - effect.userData.age / effect.userData.life));
        }

        if (effect.userData.age >= effect.userData.life) {
          scene.remove(effect);
          effect.geometry.dispose();
          effect.material.dispose();
          visualEffects.splice(i, 1);
        }
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
