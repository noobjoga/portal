<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vila Sweet — Protótipo Isométrico</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #0b1015;
      color: #e8f0f2;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game { width: 100%; height: 100%; }
    #game canvas { display: block; }
    .help {
      position: fixed;
      z-index: 10;
      left: 16px;
      top: 16px;
      max-width: min(470px, calc(100vw - 32px));
      padding: 12px 14px;
      border: 1px solid rgba(150, 220, 204, .24);
      border-radius: 10px;
      background: rgba(5, 10, 14, .80);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .28);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .help strong { color: #85efd0; }
    .help small { display: block; margin-top: 4px; color: #a9b8bc; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="help">
    <strong>Clique no chão</strong> ou use <strong>WASD / Setas</strong>.
    <small>Vila Sweet: cada losango verde representa os 2×2 SQMs de uma casa.</small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    (() => {
      'use strict';

      const TILE_W = 64;
      const TILE_H = 32;
      const CELL_SIZE = 64;
      const GRID_SIZE = 28;
      const SCREEN_SPEED = 220;
      const ARRIVAL_DISTANCE = 5;
      const ISO_ORIGIN_X = 0;
      const ISO_ORIGIN_Y = -80;

      class IsoScene extends Phaser.Scene {
        constructor() {
          super('IsoScene');
          this.player = null;
          this.playerBody = null;
          this.houses = [];
          this.destination = null;
          this.keys = null;
          this.targetMarker = null;
        }

        preload() {
          // Sprites externos: ficam na pasta do projeto, sem Base64.
          this.load.image('house-timber', './assets/houses/casa-madeira.png');
          this.load.image('house-stone', './assets/houses/casa-pedra.png');
          this.load.image('house-bakery', './assets/houses/padaria.png');
          this.load.image('house-herbalist', './assets/houses/herbalista.png');
        }

        create() {
          this.cameras.main.setBackgroundColor('#0b1015');
          this.drawIsometricGrid();
          this.drawVillagePaths();
          this.createTextures();

          const playerStart = {
            x: 14 * CELL_SIZE,
            y: 14 * CELL_SIZE
          };

          // O corpo físico vive no mapa lógico visto de cima.
          this.playerBody = this.physics.add.sprite(
            playerStart.x,
            playerStart.y,
            'physics-body'
          );
          this.playerBody.setVisible(false);
          this.playerBody.body.setSize(26, 26, true);
          this.playerBody.setCollideWorldBounds(true);
          this.playerBody.setDrag(0, 0);
          this.playerBody.setMaxVelocity(1000, 1000);

          // O jogador visível recebe somente a posição projetada.
          const playerScreen = this.worldToScreen(playerStart.x, playerStart.y);
          this.player = this.add.image(
            playerScreen.x,
            playerScreen.y,
            'temporary-player'
          );
          this.player.setOrigin(0.5, 1.0);
          this.player.depth = this.player.y;

          this.createVillageSweet();

          this.physics.world.setBounds(
            0,
            0,
            GRID_SIZE * CELL_SIZE,
            GRID_SIZE * CELL_SIZE
          );

          this.keys = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D,
            arrowUp: Phaser.Input.Keyboard.KeyCodes.UP,
            arrowDown: Phaser.Input.Keyboard.KeyCodes.DOWN,
            arrowLeft: Phaser.Input.Keyboard.KeyCodes.LEFT,
            arrowRight: Phaser.Input.Keyboard.KeyCodes.RIGHT
          });

          this.targetMarker = this.add.graphics();
          this.targetMarker.setVisible(false);

          this.input.on('pointerdown', (pointer) => {
            if (!pointer.leftButtonDown()) return;

            const screenPoint = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
            const logicalPoint = this.screenToWorld(screenPoint.x, screenPoint.y);
            logicalPoint.x = Phaser.Math.Clamp(
              logicalPoint.x,
              0,
              GRID_SIZE * CELL_SIZE
            );
            logicalPoint.y = Phaser.Math.Clamp(
              logicalPoint.y,
              0,
              GRID_SIZE * CELL_SIZE
            );

            this.destination = new Phaser.Math.Vector2(
              logicalPoint.x,
              logicalPoint.y
            );
            this.drawTargetMarker(logicalPoint.x, logicalPoint.y);
          });

          const halfMapWidth = GRID_SIZE * TILE_W / 2;
          const mapHeight = GRID_SIZE * TILE_H;
          this.cameras.main.setBounds(
            -halfMapWidth - 180,
            ISO_ORIGIN_Y - 180,
            halfMapWidth * 2 + 360,
            mapHeight + 360
          );
          this.cameras.main.startFollow(this.player, true, 0.11, 0.11);
          this.cameras.main.setZoom(1.15);
          this.cameras.main.centerOn(this.player.x, this.player.y);
        }

        update() {
          const left = this.keys.left.isDown || this.keys.arrowLeft.isDown;
          const right = this.keys.right.isDown || this.keys.arrowRight.isDown;
          const up = this.keys.up.isDown || this.keys.arrowUp.isDown;
          const down = this.keys.down.isDown || this.keys.arrowDown.isDown;
          const keyboardActive = left || right || up || down;

          if (keyboardActive) {
            this.destination = null;
            this.targetMarker.setVisible(false);

            // Converte a intenção visual (cima/baixo/esquerda/direita da tela)
            // para os dois eixos do mapa lógico.
            const screenX = Number(right) - Number(left);
            const screenY = Number(down) - Number(up);
            const screenDirection = new Phaser.Math.Vector2(
              screenX,
              screenY
            ).normalize();
            const logicalVelocity = this.screenVectorToWorld(
              screenDirection.x * SCREEN_SPEED,
              screenDirection.y * SCREEN_SPEED
            );

            this.playerBody.body.setVelocity(
              logicalVelocity.x,
              logicalVelocity.y
            );
          } else if (this.destination) {
            const dx = this.destination.x - this.playerBody.x;
            const dy = this.destination.y - this.playerBody.y;
            const screenDx = dx * (TILE_W / (2 * CELL_SIZE));
            const screenDy = dy * (TILE_H / (2 * CELL_SIZE));
            const screenDistance = Math.hypot(screenDx, screenDy);

            if (screenDistance <= ARRIVAL_DISTANCE) {
              this.playerBody.body.setVelocity(0, 0);
              this.destination = null;
              this.targetMarker.setVisible(false);
            } else {
              this.playerBody.body.setVelocity(
                (dx / screenDistance) * SCREEN_SPEED,
                (dy / screenDistance) * SCREEN_SPEED
              );
            }
          } else {
            this.playerBody.body.setVelocity(0, 0);
          }

          // Somente aqui a posição lógica vira posição isométrica na tela.
          const playerScreen = this.worldToScreen(
            this.playerBody.x,
            this.playerBody.y
          );
          this.player.setPosition(playerScreen.x, playerScreen.y);

          // A profundidade do jogador continua baseada exatamente nos pés.
          this.player.depth = this.player.y;
          this.updateHouseDepths();
          this.children.queueDepthSort();
        }

        updateHouseDepths() {
          const body = this.playerBody.body;

          for (const house of this.houses) {
            const { minX, minY, width, height } = house.footprint;
            const maxX = minX + width;
            const maxY = minY + height;

            // Mesma regra aprovada: as duas faces +X/+Y são frontais.
            const inFront = body.left >= maxX - 0.5 || body.top >= maxY - 0.5;
            const behind = body.right <= minX + 0.5 || body.bottom <= minY + 0.5;

            let playerIsInFront;

            if (inFront) {
              playerIsInFront = true;
            } else if (behind) {
              playerIsInFront = false;
            } else {
              playerIsInFront =
                this.playerBody.x > maxX || this.playerBody.y > maxY;
            }

            house.image.depth = playerIsInFront
              ? Math.min(house.baseDepth, this.player.depth - 1)
              : Math.max(house.baseDepth, this.player.depth + 1);
          }
        }

        createVillageSweet() {
          const villageHouses = [
            { tileX: 6, tileY: 8, texture: 'house-timber' },
            { tileX: 10, tileY: 8, texture: 'house-stone' },
            { tileX: 16, tileY: 8, texture: 'house-bakery' },
            { tileX: 20, tileY: 8, texture: 'house-herbalist' },
            { tileX: 6, tileY: 16, texture: 'house-stone' },
            { tileX: 10, tileY: 17, texture: 'house-timber' },
            { tileX: 16, tileY: 17, texture: 'house-herbalist' },
            { tileX: 20, tileY: 16, texture: 'house-bakery' }
          ];

          for (const config of villageHouses) {
            this.createHouse({
              ...config,
              tilesWide: 2,
              tilesDeep: 2
            });
          }

          const signPoint = this.worldToScreen(5 * CELL_SIZE, 14 * CELL_SIZE);
          const sign = this.add.text(signPoint.x, signPoint.y - 8, 'VILA SWEET', {
            fontFamily: 'system-ui, sans-serif',
            fontSize: '18px',
            fontStyle: 'bold',
            color: '#fff4dc',
            backgroundColor: '#7a3f52',
            padding: { x: 10, y: 6 },
            stroke: '#321b24',
            strokeThickness: 3
          });
          sign.setOrigin(0.5, 1.0);
          sign.setDepth(signPoint.y);
        }

        createHouse({ tileX, tileY, tilesWide, tilesDeep, texture }) {
          const minX = tileX * CELL_SIZE;
          const minY = tileY * CELL_SIZE;
          const width = tilesWide * CELL_SIZE;
          const height = tilesDeep * CELL_SIZE;
          const centerX = minX + width / 2;
          const centerY = minY + height / 2;

          const footprint = { minX, minY, width, height };

          // Bloco físico: retângulo exato de 2×2 SQMs no mundo lógico.
          const houseBlock = this.add.zone(centerX, centerY, width, height);
          houseBlock.setOrigin(0.5, 0.5);
          this.physics.add.existing(houseBlock, true);
          houseBlock.body.updateFromGameObject();

          // O canto frontal do quadrado lógico vira a base do desenho.
          const frontCorner = this.worldToScreen(minX + width, minY + height);
          const houseImage = this.add.image(
            frontCorner.x,
            frontCorner.y,
            texture
          );
          houseImage.setOrigin(0.5, 1.0);

          // Encaixa qualquer sprite no revestimento visual aprovado sem
          // deformar sua proporção e sem alterar os SQMs físicos.
          const visualScale = Math.min(
            180 / houseImage.width,
            160 / houseImage.height
          );
          houseImage.setScale(visualScale);
          houseImage.depth = frontCorner.y;

          const house = {
            block: houseBlock,
            image: houseImage,
            footprint,
            baseDepth: frontCorner.y,
            debug: null
          };
          this.houses.push(house);

          // Repete exatamente o collider aprovado para cada nova residência.
          this.physics.add.collider(this.playerBody, houseBlock, () => {
            if (this.destination && this.targetMarker) {
              this.destination = null;
              this.targetMarker.setVisible(false);
            }
          });

          // Debug projetado: o retângulo lógico aparece como losango perfeito.
          house.debug = this.drawProjectedFootprint(footprint);
        }

        createTextures() {
          const bodyTexture = this.textures.createCanvas('physics-body', 26, 26);
          bodyTexture.getContext().clearRect(0, 0, 26, 26);
          bodyTexture.refresh();

          const playerTexture = this.textures.createCanvas(
            'temporary-player',
            32,
            64
          );
          const playerCtx = playerTexture.getContext();
          playerCtx.fillStyle = '#43d9b2';
          playerCtx.fillRect(0, 10, 32, 54);
          playerCtx.fillStyle = '#b8fff0';
          playerCtx.beginPath();
          playerCtx.moveTo(16, 0);
          playerCtx.lineTo(5, 15);
          playerCtx.lineTo(27, 15);
          playerCtx.closePath();
          playerCtx.fill();
          playerCtx.strokeStyle = '#153a38';
          playerCtx.lineWidth = 2;
          playerCtx.strokeRect(1, 11, 30, 52);
          playerTexture.refresh();
        }

        worldToScreen(worldX, worldY) {
          return new Phaser.Math.Vector2(
            ISO_ORIGIN_X + (worldX - worldY) * (TILE_W / (2 * CELL_SIZE)),
            ISO_ORIGIN_Y + (worldX + worldY) * (TILE_H / (2 * CELL_SIZE))
          );
        }

        screenToWorld(screenX, screenY) {
          const projectedX = screenX - ISO_ORIGIN_X;
          const projectedY = screenY - ISO_ORIGIN_Y;
          const difference = projectedX / (TILE_W / (2 * CELL_SIZE));
          const sum = projectedY / (TILE_H / (2 * CELL_SIZE));

          return new Phaser.Math.Vector2(
            (sum + difference) / 2,
            (sum - difference) / 2
          );
        }

        screenVectorToWorld(screenX, screenY) {
          const difference = screenX / (TILE_W / (2 * CELL_SIZE));
          const sum = screenY / (TILE_H / (2 * CELL_SIZE));

          return new Phaser.Math.Vector2(
            (sum + difference) / 2,
            (sum - difference) / 2
          );
        }

        drawIsometricGrid() {
          const grid = this.add.graphics();

          for (let row = 0; row < GRID_SIZE; row++) {
            for (let col = 0; col < GRID_SIZE; col++) {
              const minX = col * CELL_SIZE;
              const minY = row * CELL_SIZE;
              const top = this.worldToScreen(minX, minY);
              const right = this.worldToScreen(minX + CELL_SIZE, minY);
              const bottom = this.worldToScreen(
                minX + CELL_SIZE,
                minY + CELL_SIZE
              );
              const left = this.worldToScreen(minX, minY + CELL_SIZE);
              const alternating = (row + col) % 2 === 0;

              grid.fillStyle(alternating ? 0x182b2a : 0x142523, 1);
              grid.lineStyle(1, 0x31504b, 0.8);
              grid.beginPath();
              grid.moveTo(top.x, top.y);
              grid.lineTo(right.x, right.y);
              grid.lineTo(bottom.x, bottom.y);
              grid.lineTo(left.x, left.y);
              grid.closePath();
              grid.fillPath();
              grid.strokePath();
            }
          }

          grid.setDepth(-100000);
        }

        drawVillagePaths() {
          const paths = this.add.graphics();
          const roadTiles = new Set();

          // Duas ruas de 2 SQMs se cruzam na praça central.
          for (let tile = 4; tile <= 23; tile++) {
            roadTiles.add(`${tile},13`);
            roadTiles.add(`${tile},14`);
            roadTiles.add(`13,${tile}`);
            roadTiles.add(`14,${tile}`);
          }

          for (let row = 12; row <= 15; row++) {
            for (let col = 12; col <= 15; col++) {
              roadTiles.add(`${col},${row}`);
            }
          }

          for (const tile of roadTiles) {
            const [col, row] = tile.split(',').map(Number);
            const minX = col * CELL_SIZE;
            const minY = row * CELL_SIZE;
            const top = this.worldToScreen(minX, minY);
            const right = this.worldToScreen(minX + CELL_SIZE, minY);
            const bottom = this.worldToScreen(minX + CELL_SIZE, minY + CELL_SIZE);
            const left = this.worldToScreen(minX, minY + CELL_SIZE);

            paths.fillStyle(0x765e49, 0.92);
            paths.lineStyle(1, 0xa98a67, 0.55);
            paths.beginPath();
            paths.moveTo(top.x, top.y);
            paths.lineTo(right.x, right.y);
            paths.lineTo(bottom.x, bottom.y);
            paths.lineTo(left.x, left.y);
            paths.closePath();
            paths.fillPath();
            paths.strokePath();
          }

          paths.setDepth(-99999);
        }

        drawProjectedFootprint(footprint) {
          const { minX, minY, width, height } = footprint;
          const top = this.worldToScreen(minX, minY);
          const right = this.worldToScreen(minX + width, minY);
          const bottom = this.worldToScreen(minX + width, minY + height);
          const left = this.worldToScreen(minX, minY + height);

          const footprintDebug = this.add.graphics();
          footprintDebug.fillStyle(0x00ff66, 0.08);
          footprintDebug.lineStyle(2, 0x00ff66, 0.9);
          footprintDebug.beginPath();
          footprintDebug.moveTo(top.x, top.y);
          footprintDebug.lineTo(right.x, right.y);
          footprintDebug.lineTo(bottom.x, bottom.y);
          footprintDebug.lineTo(left.x, left.y);
          footprintDebug.closePath();
          footprintDebug.fillPath();
          footprintDebug.strokePath();
          footprintDebug.setDepth(1000000);
          return footprintDebug;
        }

        drawTargetMarker(worldX, worldY) {
          const point = this.worldToScreen(worldX, worldY);
          this.targetMarker.clear();
          this.targetMarker.lineStyle(2, 0xffd166, 0.95);
          this.targetMarker.strokeEllipse(point.x, point.y, 24, 12);
          this.targetMarker.lineBetween(
            point.x - 8,
            point.y,
            point.x + 8,
            point.y
          );
          this.targetMarker.lineBetween(
            point.x,
            point.y - 4,
            point.x,
            point.y + 4
          );
          this.targetMarker.setDepth(point.y + 1);
          this.targetMarker.setVisible(true);
        }
      }

      const game = new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        backgroundColor: '#0b1015',
        scale: {
          mode: Phaser.Scale.RESIZE,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          width: window.innerWidth,
          height: window.innerHeight
        },
        physics: {
          default: 'arcade',
          arcade: {
            gravity: { x: 0, y: 0 },
            debug: false
          }
        },
        scene: IsoScene
      });

      window.addEventListener('resize', () => {
        game.scale.resize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
